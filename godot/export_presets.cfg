; Public-safe packaging draft only. Not a delivered executable.
; Private local-playtest audio and character assets must never be silently bundled.
[preset.0]
name="Windows Desktop Asset Review"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="assets/audio/local_music/*,assets/audio/local_voice/*,assets/characters/*,assets/backgrounds/*,assets/story/*,data/audio.json,tests/*,bin/*"
export_path="../release/godot-asset-review/CAS.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/icon="res://assets/branding/fletcher-v2/fletcher-windows.ico"

; Icon packaging and editable Android preset only. Native gameplay bridge still
; requires an Android port; this preset does not claim a delivered playable APK.
[preset.1]
name="Android Icon Asset Review"
platform="Android"
runnable=false
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="assets/audio/local_music/*,assets/audio/local_voice/*,assets/characters/*,assets/backgrounds/*,assets/story/*,data/audio.json,tests/*,bin/*"
export_path="../release/android-asset-review/CAS.apk"
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]
gradle_build/use_gradle_build=false
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
version/code=1
version/name="0.1-island-review"
package/unique_name="top.cas.returnlight.review"
package/name="CAS · 归航"
package/signed=true
launcher_icons/main_192x192="res://assets/branding/fletcher-v2/android/res/mipmap-xxxhdpi/ic_launcher.png"
launcher_icons/adaptive_foreground_432x432="res://assets/branding/fletcher-v2/android/res/mipmap-xxxhdpi/ic_launcher_foreground.png"
launcher_icons/adaptive_background_432x432="res://assets/branding/fletcher-v2/android/res/mipmap-xxxhdpi/ic_launcher_background.png"
